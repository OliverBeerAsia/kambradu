name: Pages

# Publish the static export to GitHub Pages when a release is published, or
# on demand. The site is served under /kambradu, so the build takes that as
# its base path; the CI workflow keeps testing the root build.
on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /kambradu
          KAMBRADU_RELEASE_ENV: github-pages
      - name: Refuse a build that still points at the site root
        run: |
          if grep -rlE '(href|src)="/(fonts|hegel\.png|icon\.svg|apple-touch-icon\.png|_next)' out; then
            echo "root-absolute asset paths survived the base path" >&2
            exit 1
          fi
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
